services:
  - type: web
    name: diagramforge-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    # Long timeout: "complete documentation" makes up to ~11 LLM calls in one request.
    startCommand: gunicorn app:app --workers 2 --threads 4 --timeout 300
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: PLANTUML_SERVER
        value: https://www.plantuml.com/plantuml
